use_default_settings: true

server:
  # secret_key is set via SEARXNG_SECRET_KEY environment variable in docker-compose
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: radio browser
    disabled: true
